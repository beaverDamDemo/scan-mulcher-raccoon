<app-page-header [title]="'Riconosci Trattori'" [backLink]="'/'"></app-page-header>

<div class="page recognize-the-tractor">
  <header>
    <h2>Riconosci Trattori</h2>
    <p>{{ tractors.length }} modelli disponibili</p>
  </header>

  <section class="tractor-grid" aria-label="Elenco trattori">
    @for (tractor of tractors; track tractor.id) {
    <article class="tractor-card">
      <img [src]="tractor.image" [alt]="tractor.brand + ' ' + tractor.model" />
      <div class="tractor-card-content">
        <p class="tractor-brand">{{ tractor.brand }}</p>
        <h2>{{ tractor.model }}</h2>
        <p class="tractor-years">{{ tractor.years }}</p>
      </div>
    </article>
    }
  </section>
</div>
