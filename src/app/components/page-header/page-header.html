<header class="page-header">

      class="inline-flex cursor-pointer items-center rounded-lg border border-white/80 bg-transparent px-3 py-2 text-sm font-semibold text-white transition hover:bg-white/15 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white"
      aria-label="Torna allo scanner">
      <img ngSrc="/assets/images/home.png" width="20" height="20" alt="Home" class="mr-2 h-5 w-5 object-contain" />
      Torna allo scanner
    </a>

    <h1 class="page-header__title">{{ title() }}</h1>
  </div>
</header>
